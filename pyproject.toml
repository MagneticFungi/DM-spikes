[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-spikes"
version = "0.1.0"
description = "Self-consistent adiabatic dark-matter spikes with Eddington inversion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest>=7"]
notebooks = [
    "matplotlib",
    "ipykernel",
    "jupyterlab",
]

[project.scripts]
dm-spikes-profiles = "dm_spikes.profile_cli:main"

[project.urls]
Repository = "https://github.com/MagneticFungi/DM-spikes"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dm_spikes*"]
namespaces = false

[tool.pytest.ini_options]
markers = ["slow: computationally expensive scientific validation"]
